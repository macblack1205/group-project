<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Askıda Prototype</title>
<meta name="description" content="Interactive prototype of Askıda, a neighborhood donation app that connects donors with verified recipients in Istanbul.">
<meta name="theme-color" content="#F8F4ED">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F6A43'/%3E%3Cpath d='M32 22l-20 15c-1.6 1.2-.9 3 1 3h38c1.9 0 2.6-1.8 1-3z' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linejoin='round'/%3E%3Cpath d='M32 22v-3c0-1.4 1-2 2-2.8 1.8-1.2 2.6-2.2 2.6-3.6a4.6 4.6 0 0 0-9.2.3' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="tb-brand"><span class="tb-mark" id="tbMark"></span>Askıda<span class="tb-tag">Interactive prototype</span></div>
    <span class="tb-sp"></span>
    <button class="tb-btn" type="button" data-ctl="hints" aria-pressed="false" title="Show what you can tap (H)"><span class="tb-ic" data-icon="pointer"></span>Tap hints</button>
    <button class="tb-btn" type="button" data-ctl="present" aria-pressed="false" title="Presentation mode (P). Use the arrow keys to move between screens."><span class="tb-ic" data-icon="play"></span>Present</button>
    <button class="tb-btn" type="button" data-ctl="reset" title="Put the demo data back to the start"><span class="tb-ic" data-icon="reset"></span>Reset demo</button>
    <a class="tb-btn" href="https://github.com/macblack1205/group-project" target="_blank" rel="noopener"><span class="tb-ic" data-icon="ext"></span>Repo</a>
  </header>

  <aside class="nav" aria-label="Screens">
    <div class="screen-nav"></div>
    <p class="nav-tip"><kbd>←</kbd> <kbd>→</kbd> move between screens · <kbd>H</kbd> tap hints · <kbd>P</kbd> present</p>
  </aside>

  <main class="stage">
    <div class="phone-wrap" id="phoneWrap">
      <div class="phone" id="phone">
        <div class="island" aria-hidden="true"></div>
        <div class="app" id="app">
          <div class="sbar" aria-hidden="true"><span>9:41</span><span class="sb-r"><svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.4 1.4a4.5 4.5 0 0 0-6.4 0zM1 4.4a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0z"/></svg><svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" opacity=".4"/></svg></span></div>
          <div id="screens"></div>
          <nav class="tabbar" id="tabbar" aria-label="App navigation">
            <button type="button" data-tab="home"><span data-icon="home"></span><span>Home</span></button>
            <button type="button" data-act="donateTab"><span data-icon="bag"></span><span>Donate</span></button>
            <button type="button" data-tab="explore"><span data-icon="search"></span><span>Explore</span></button>
            <button type="button" data-tab="messages"><span data-icon="msg"></span><span>Messages</span><i class="badge"></i></button>
            <button type="button" data-tab="profile"><span data-icon="user"></span><span>Profile</span></button>
          </nav>
          <div class="banner" id="banner" role="status"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="sheet-wrap" id="sheet"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet" id="sheetPanel"></div></div>
          <span class="home-ind" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <div class="caption" id="caption"></div>
  </main>

  <aside class="panel" id="panel" aria-label="Team notes and suggestions">
    <div class="pn-head">
      <div class="pn-tabs" role="tablist">
        <button type="button" role="tab" data-pt="notes">Notes<i class="cnt" id="cntN"></i></button>
        <button type="button" role="tab" data-pt="sugg">Suggestions<i class="cnt" id="cntS"></i></button>
        <button type="button" role="tab" data-pt="screens" class="pt-screens">Screens</button>
      </div>
      <button type="button" class="pn-close" data-ctl="drawer" aria-label="Close panel"><span data-icon="x"></span></button>
    </div>
    <div class="pn-body" id="pnBody"></div>
  </aside>
</div>

<button type="button" class="fab" data-ctl="drawer" aria-label="Open notes and suggestions"><span data-icon="note"></span></button>
<div class="scrim" data-ctl="drawer"></div>

<script src="js/art.js"></script>
<script>
  // fill static icons
  document.querySelectorAll("[data-icon]").forEach(function (el) { el.outerHTML = ART.icon(el.getAttribute("data-icon")); });
  document.getElementById("tbMark").innerHTML = ART.logo("#B67B4C");
</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/team.js"></script>
</body>
</html>
